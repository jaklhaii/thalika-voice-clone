name: KM Voice Clone Bot

on:
  schedule:
    # Check for new Telegram messages every 2 minutes
    - cron: "*/2 * * * *"
  workflow_dispatch:  # also allows manual one-click run

jobs:
  bot:
    runs-on: ubuntu-latest
    outputs:
      pending_count: ${{ steps.pending.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run bot (process pending messages once)
        env:
          RUN_MODE: github
          GEN_MODE: github
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: python3 bot.py 2>&1 | tee bot_run.log; echo "EXIT=$?"

      - name: Save getUpdates debug info
        run: |
          echo "--- env ---"
          env | grep -E '^(RUN_MODE|GEN_MODE|BOT_TOKEN|HOME|GITHUB)' | sed 's/^BOT_TOKEN=.*/BOT_TOKEN=*** (set)/'
          python3 - <<'PY' | head -c 4000
import os, json, urllib.request
token = os.environ.get("BOT_TOKEN", "")
if not token:
    print("BOT_TOKEN EMPTY (bot.py falls back to hardcoded token)")
    token = "PUT_BOT_TOKEN_HERE"
url = f"https://api.telegram.org/bot{token}/getUpdates?timeout=5&allowed_updates=message"
try:
    with urllib.request.urlopen(urllib.request.Request(url), timeout=15) as r:
        d = json.load(r)
        res = d.get("result", [])
        print("ok:", d.get("ok"), "updates:", len(res))
        for u in res[:5]:
            m = u["message"]
            print(u["update_id"], m.get("from", {}).get("id"), repr((m.get("text") or "")[:30]))
except Exception as e:
    print("getUpdates error:", e)
PY

      - name: Upload bot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-run-${{ github.run_id }}
          path: bot_run.log
          retention-days: 3

      - name: Check pending jobs
        id: pending
        run: |
          n=$(find scripts/ghq/pending -name "*.json" 2>/dev/null | wc -l)
          echo "count=$n"
          echo "count=$n" >> "$GITHUB_OUTPUT"

  generate:
    needs: bot
    if: needs.bot.outputs.pending_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Add 4GB swap (resilient)
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 2>/dev/null || { echo "dd failed, trying smaller"; sudo dd if=/dev/zero of=/swapfile bs=1M count=2048 2>/dev/null || true; }
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile 2>&1 | tail -1
          sudo swapon /swapfile 2>&1 | tail -1
          free -h

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('scripts/gh-queue-worker.py') }}

      - name: Install CPU PyTorch + voxcpm + soundfile
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision torchaudio
          python3 -m pip install voxcpm soundfile numpy

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: voxcpm-gguf-v1

      - name: Run voice generation queue worker
        env:
          VOXCPM_MODEL_DIR: DennisHuang648/VoxCPM2-GGUF
          HF_HUB_HOME: ~/.cache/huggingface
        run: python3 scripts/gh-queue-worker.py

      - name: Commit results and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ghq/
          if ! git diff --cached --quiet; then
            git commit -m "voice jobs: commit results / refs (auto)"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
          else
            echo "nothing to commit"
          fi

      - name: Trigger bot to deliver voices
        run: |
          sleep 30
          curl -s -X POST "https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot.yml/dispatches" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"ref":"main"}'
